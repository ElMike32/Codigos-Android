name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Sobrescribe AndroidManifest.xml asegurando sintaxis pura y comillas ASCII válidas
      - name: Overwrite AndroidManifest Cleanly
        run: |
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          printf '%s\n' '<manifest xmlns:android="http://schemas.android.com/apk/android">' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '    <uses-permission android:name="android.permission.INTERNET" />' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '    <application' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '        android:allowBackup="true"' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '        android:label="Visor Componentes"' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '        android:supportsRtl="true">' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '        <activity' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '            android:name=".MainActivity"' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '            android:exported="true">' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '            <intent-filter>' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '            </intent-filter>' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '        </activity>' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '    </application>' >> app/src/main/AndroidManifest.xml
          printf '%s\n' '</manifest>' >> app/src/main/AndroidManifest.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Force Compatible Gradle Version
        run: gradle wrapper --gradle-version 8.5

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
