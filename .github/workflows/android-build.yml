name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Permite ejecutar la compilación manualmente desde la web de GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Evita timeouts prematuros durante la compilación

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          generate-job-summary: true

      # Genera o repara automáticamente el wrapper de Gradle si falta el archivo ejecutable o el jar
      - name: Generate Gradle Wrapper
        run: gradle wrapper

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
