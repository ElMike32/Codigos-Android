name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Descargar Código Fuente
      uses: actions/checkout@v4

    - name: Configurar Entorno Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependencias del Sistema y Android SDK Tools
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libssl-dev libffi-dev lib32z1 lib32stdc++6 zlib1g:i386
        pip install --upgrade buildozer cython

    - name: Aceptar Licencias de Android SDK
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        yes | sdkmanager --licenses || true

    - name: Compilar APK con Buildozer
      run: |
        yes | buildozer android debug

    - name: Guardar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: App_Componentes_Android_APK
        path: bin/*.apk
