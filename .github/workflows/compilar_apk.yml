name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Descargar Código Fuente
      uses: actions/checkout@v4

    - name: Configurar Entorno Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependencias del Sistema
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libssl-dev libffi-dev lib32z1 lib32stdc++6 zlib1g:i386 wget
        pip install --upgrade buildozer cython

    - name: Restaurar Caché de Buildozer
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-${{ runner.os }}-

    - name: Pre-instalar Command-line Tools, SDK y Symlink
      run: |
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p $SDK_DIR/cmdline-tools

        if [ ! -d "$SDK_DIR/cmdline-tools/latest" ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $SDK_DIR/cmdline-tools
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest
          rm cmdline-tools.zip
        fi

        mkdir -p $SDK_DIR/tools/bin
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager

        export PATH=$PATH:$SDK_DIR/cmdline-tools/latest/bin
        yes | sdkmanager --sdk_root=$SDK_DIR --licenses || true
        sdkmanager --sdk_root=$SDK_DIR "platforms;android-33" "build-tools;33.0.2" "platform-tools" || true

    - name: Compilar APK con Buildozer (Evitando HTTP 403)
      run: |
        # Configurar User-Agent global para evitar bloqueos HTTP 403 en urllib
        export HTTP_USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        export PYTHONHTTPSVERIFY=0

        for attempt in {1..3}; do
          echo "Intento de compilación $attempt..."
          if buildozer android debug -- --minapi=24; then
            echo "¡Compilación exitosa!"
            exit 0
          fi
          if [ $attempt -lt 3 ]; then
            echo "Falló el intento $attempt. Reintentando en 30 segundos..."
            sleep 30
          else
            echo "La compilación falló tras 3 intentos."
            exit 1
          fi
        done

    - name: Guardar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: App_Componentes_Android_APK
        path: bin/*.apk
