name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Descargar Código Fuente
      uses: actions/checkout@v4

    - name: Configurar Entorno Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK Oficial y Aceptar Licencias
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: '9477386'
        accept-android-sdk-licenses: true

    - name: Instalar Herramientas del SDK Requeridas
      run: |
        yes | sdkmanager "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

    - name: Instalar Dependencias del Sistema
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libssl-dev libffi-dev lib32z1 lib32ncurses6
        pip install --upgrade buildozer cython

    - name: Preparar Licencias Globales para Buildozer
      run: |
        # Garantizar que Buildozer encuentre las licencias aceptadas en su ruta home
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true

    - name: Compilar APK con Buildozer
      run: |
        export PIP_DEFAULT_TIMEOUT=1000
        export HTTP_USER_AGENT="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
        
        mkdir -p ~/.pip
        cat > ~/.pip/pip.conf << 'EOF'
        [global]
        retries = 5
        timeout = 120
        index-url = https://pypi.org/simple/
        EOF

        # Ejecutamos la compilación. Se quita el borrado agresivo de ~/.buildozer en caso de fallo
        buildozer android debug

    - name: Guardar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: App_Componentes_Android_APK
        path: bin/*.apk
