name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Descargar Código Fuente
      uses: actions/checkout@v4

    - name: Configurar Entorno Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependencias del Sistema
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libssl-dev libffi-dev lib32z1 lib32ncurses6
        pip install --upgrade buildozer cython

    - name: Pre-instalar Android SDK con Espejos Directos
      run: |
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p $SDK_DIR/cmdline-tools
        mkdir -p $SDK_DIR/build-tools
        mkdir -p $SDK_DIR/platforms
      
        if [ ! -d "$SDK_DIR/cmdline-tools/latest" ]; then
          wget --user-agent="Mozilla/5.0" -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $SDK_DIR/cmdline-tools
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest
          rm -f cmdline-tools.zip
        fi
      
        mkdir -p $SDK_DIR/tools/bin
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
      
        export PATH=$PATH:$SDK_DIR/cmdline-tools/latest/bin
        yes | sdkmanager --sdk_root=$SDK_DIR --licenses || true
        sdkmanager --sdk_root=$SDK_DIR "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;25.2.9519653" || true

    - name: Compilar APK con Buildozer (Fix HTTP 403 & Retry)
      run: |
        # Configuración de variables de entorno para descargas y reintentos
        export PIP_DEFAULT_TIMEOUT=1000
        export HTTP_USER_AGENT="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
        
        mkdir -p ~/.pip
        cat > ~/.pip/pip.conf << 'EOF'
        [global]
        retries = 5
        timeout = 120
        index-url = https://pypi.org/simple/
        EOF

        for attempt in {1..3}; do
          echo "=========================================="
          echo "Intento de compilación $attempt de 3..."
          echo "=========================================="
          
          if buildozer android debug; then
            echo "¡Compilación exitosa!"
            exit 0
          fi
          
          if [ $attempt -lt 3 ]; then
            echo "El intento $attempt falló. Limpiando caché y esperando..."
            rm -rf .buildozer/
            rm -rf ~/.buildozer/
            sleep 60
          else
            echo "La compilación falló tras 3 intentos."
            exit 1
          fi
        done
        
    - name: Guardar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: App_Componentes_Android_APK
        path: bin/*.apk
