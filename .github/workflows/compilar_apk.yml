name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Descargar Código Fuente
      uses: actions/checkout@v4

    - name: Configurar Entorno Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependencias del Sistema
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-dev autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libssl-dev libffi-dev lib32z1 lib32ncurses6
        pip install --upgrade buildozer cython

    - name: Pre-aceptar Licencias de Android SDK para Buildozer
      run: |
        # Generar archivos de licencias pre-aceptadas en la ruta donde Buildozer descarga el SDK
        MK_DIR="$HOME/.buildozer/android/platform/android-sdk/licenses"
        mkdir -p "$MK_DIR"
        
        echo -e "\n24333702357913b5d178083be002f21f3969ab1\nd56f51854777bf724190fe91fc7034232b663ee6\n84831b9402646d56e45001193d3b37d6ef9d207a" > "$MK_DIR/android-sdk-license"
        echo -e "\n84831b9402646d56e45001193d3b37d6ef9d207a" > "$MK_DIR/android-sdk-preview-license"

        # También sincronizar licencias del SDK preinstalado si existe
        if [ -d "$ANDROID_HOME/licenses" ]; then
          cp -r $ANDROID_HOME/licenses/* "$MK_DIR/" || true
        fi

    - name: Compilar APK con Buildozer
      run: |
        export PIP_DEFAULT_TIMEOUT=1000
        export HTTP_USER_AGENT="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"
        
        mkdir -p ~/.pip
        cat > ~/.pip/pip.conf << 'EOF'
        [global]
        retries = 5
        timeout = 120
        index-url = https://pypi.org/simple/
        EOF

        # Se especifican banderas CLI fijas para evitar la descarga no interactiva de Build-Tools 37
        buildozer android debug -- --build-tools=33.0.2 --sdk=33

    - name: Guardar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: App_Componentes_Android_APK
        path: bin/*.apk
