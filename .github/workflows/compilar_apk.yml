name: Compilar APK de Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Descargar Código Fuente
      uses: actions/checkout@v4

    - name: Configurar Entorno Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Instalar Dependencias del Sistema
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev cmake libssl-dev libffi-dev lib32z1 lib32stdc++6 zlib1g:i386 wget curl
        pip install --upgrade buildozer cython

    - name: Pre-instalar Android SDK con Espejos Directos
      run: |
        SDK_DIR="/home/runner/.buildozer/android/platform/android-sdk"
        mkdir -p $SDK_DIR/cmdline-tools

        if [ ! -d "$SDK_DIR/cmdline-tools/latest" ]; then
          wget --user-agent="Mozilla/5.0" -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $SDK_DIR/cmdline-tools
          mv $SDK_DIR/cmdline-tools/cmdline-tools $SDK_DIR/cmdline-tools/latest
          rm -f cmdline-tools.zip
        fi

        mkdir -p $SDK_DIR/tools/bin
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager

        export PATH=$PATH:$SDK_DIR/cmdline-tools/latest/bin
        yes | sdkmanager --sdk_root=$SDK_DIR --licenses || true
        sdkmanager --sdk_root=$SDK_DIR "platforms;android-33" "build-tools;33.0.2" "platform-tools" || true

    - name: Compilar APK con Buildozer (Fix HTTP 403 & Retry)
      run: |
        # Configurar Variables Globales para Forzar User-Agent en Python y Pip
        export PIP_DEFAULT_TIMEOUT=1000
        export HTTP_USER_AGENT="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
        export PIP_USER_AGENT="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"

        for attempt in {1..3}; do
          echo "=========================================="
          echo "Intento de compilación $attempt de 3..."
          echo "=========================================="
          
          if buildozer android debug -- --minapi=24; then
            echo "¡Compilación exitosa!"
            exit 0
          fi
          
          if [ $attempt -lt 3 ]; then
            echo "El intento $attempt falló. Limpiando caché corrupta y reintentando en 30s..."
            # Limpiar descargas intermedias que causan bucles de error HTTP 403
            rm -rf .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/
            sleep 30
          else
            echo "La compilación falló tras 3 intentos."
            exit 1
          fi
        done

    - name: Guardar APK como Artefacto Descargable
      uses: actions/upload-artifact@v4
      with:
        name: App_Componentes_Android_APK
        path: bin/*.apk
